# Not a member of the root workspace: the empty table below makes this its own workspace root.
[workspace]

[package]
name = "lucida-analytics"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Lucida server SDK: batched events, local feature-flag evaluation, historical import"
readme = "README.md"
repository = "https://github.com/lucidaanalytics/lucida-rust"
homepage = "https://github.com/lucidaanalytics/lucida-rust"
keywords = ["analytics", "feature-flags", "product-analytics"]
categories = ["api-bindings"]

[lib]
name = "lucida"

[features]
default = ["blocking"]
# Thread-based client on reqwest::blocking.
blocking = ["reqwest/blocking"]
# AsyncClient on tokio + async reqwest.
tokio = ["dep:tokio"]

[dependencies]
fastrand = "2"
flate2 = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", optional = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
assert_is_empty = "allow"
many_single_char_names = "allow"
struct_excessive_bools = "allow"
float_cmp = "allow"
needless_pass_by_value = "allow"
missing_panics_doc = "allow"
format_collect = "allow"
